name: Déploiement du site (GitHub Pages)

on:
  push:
    branches: ["claude/cousins-instagram-website-p7pc2q"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer le contenu du site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Téléverser l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
