<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1040" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4D27A"/>
      <stop offset="45%" stop-color="#E9B949"/>
      <stop offset="100%" stop-color="#C8902B"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1F8A57"/>
      <stop offset="42%" stop-color="#E9B949"/>
      <stop offset="58%" stop-color="#E9B949"/>
      <stop offset="100%" stop-color="#D24A34"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#1a1305"/>
      <stop offset="55%" stop-color="#100c08"/>
      <stop offset="100%" stop-color="#0c0a08"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="34%" r="55%">
      <stop offset="0%" stop-color="#E9B949" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#E9B949" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1040" fill="url(#bg)"/>
  <ellipse cx="400" cy="330" rx="360" ry="300" fill="url(#glow)"/>

  <text x="400" y="60" text-anchor="middle" fill="#CBB89C" font-size="15" letter-spacing="6">CHARTE D'IDENTITÉ — KOOM/KOOM</text>

  <!-- SYMBOLE : infini dominant porté par un bol profond (calebasse) -->
  <g transform="translate(400,300)">
    <!-- bol profond (pas un sourire) -->
    <path d="M-150 0 C-150 200 150 200 150 0" fill="none" stroke="#4a3310" stroke-width="34" stroke-linecap="round" opacity="0.5" transform="translate(0,8)"/>
    <path d="M-150 0 C-150 200 150 200 150 0" fill="none" stroke="url(#bowl)" stroke-width="30" stroke-linecap="round"/>
    <ellipse cx="0" cy="186" rx="46" ry="11" fill="#4a3310" opacity="0.6"/>
    <!-- barres de croissance -->
    <g fill="url(#gold)">
      <rect x="-30" y="78" width="16" height="40" rx="3"/>
      <rect x="-8" y="56" width="16" height="62" rx="3"/>
      <rect x="14" y="32" width="16" height="86" rx="3"/>
    </g>
    <!-- infini grand, posé sur le rim -->
    <g transform="translate(0,-46)">
      <path d="M0 8 C0 -42 -86 -42 -86 8 C-86 58 0 58 0 8 C0 -42 86 -42 86 8 C86 58 0 58 0 8 Z"
            fill="none" stroke="#5A3D12" stroke-width="27" stroke-linecap="round" opacity="0.5" transform="translate(0,5)"/>
      <path d="M0 8 C0 -42 -86 -42 -86 8 C-86 58 0 58 0 8 C0 -42 86 -42 86 8 C86 58 0 58 0 8 Z"
            fill="none" stroke="url(#gold)" stroke-width="27" stroke-linecap="round"/>
    </g>
  </g>

  <!-- WORDMARK empilé K∞M / K∞M, infini GRAND -->
  <g text-anchor="middle" font-weight="700">
    <g transform="translate(400,640)">
      <text x="-122" y="0" fill="#F4ECDC" font-size="130">K</text>
      <g transform="translate(0,-40)">
        <path d="M0 0 C0 -34 -64 -34 -64 0 C-64 34 0 34 0 0 C0 -34 64 -34 64 0 C64 34 0 34 0 0 Z"
              fill="none" stroke="url(#gold)" stroke-width="19" stroke-linecap="round"/>
      </g>
      <text x="122" y="0" fill="#F4ECDC" font-size="130">M</text>
    </g>
    <g transform="translate(400,780)">
      <text x="-122" y="0" fill="#F4ECDC" font-size="130">K</text>
      <g transform="translate(0,-40)">
        <path d="M0 0 C0 -34 -64 -34 -64 0 C-64 34 0 34 0 0 C0 -34 64 -34 64 0 C64 34 0 34 0 0 Z"
              fill="none" stroke="url(#gold)" stroke-width="19" stroke-linecap="round"/>
      </g>
      <text x="122" y="0" fill="#F4ECDC" font-size="130">M</text>
    </g>
  </g>

  <text x="400" y="848" text-anchor="middle" fill="#CBB89C" font-size="20" letter-spacing="10">SOUTENIR · DÉVELOPPER · GUIDER</text>

  <!-- anneau Sénégal -->
  <g transform="translate(400,884)">
    <rect x="-150" y="0" width="100" height="7" rx="3.5" fill="#1F8A57"/>
    <rect x="-50" y="0" width="100" height="7" rx="3.5" fill="#E9B949"/>
    <rect x="50" y="0" width="100" height="7" rx="3.5" fill="#D24A34"/>
  </g>

  <!-- palette -->
  <g transform="translate(150,940)">
    <rect x="0"   y="0" width="60" height="40" rx="6" fill="#E9B949"/>
    <rect x="75"  y="0" width="60" height="40" rx="6" fill="#E07B39"/>
    <rect x="150" y="0" width="60" height="40" rx="6" fill="#3B73D6"/>
    <rect x="225" y="0" width="60" height="40" rx="6" fill="#1F8A57"/>
    <rect x="300" y="0" width="60" height="40" rx="6" fill="#D24A34"/>
    <rect x="375" y="0" width="60" height="40" rx="6" fill="#121726"/>
    <rect x="450" y="0" width="60" height="40" rx="6" fill="#F4ECDC"/>
  </g>
  <text x="400" y="1015" text-anchor="middle" fill="#7a6f5e" font-size="13" letter-spacing="3">Né et lancé au Sénégal — palette chaude premium</text>
</svg>
