<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4D27A"/>
      <stop offset="45%" stop-color="#E9B949"/>
      <stop offset="100%" stop-color="#C8902B"/>
    </linearGradient>
    <linearGradient id="cradle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1F8A57"/>
      <stop offset="42%" stop-color="#E9B949"/>
      <stop offset="58%" stop-color="#E9B949"/>
      <stop offset="100%" stop-color="#D24A34"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="22%" r="70%">
      <stop offset="0%" stop-color="#1a1305"/>
      <stop offset="55%" stop-color="#100c08"/>
      <stop offset="100%" stop-color="#0c0a08"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#E9B949" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#E9B949" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <ellipse cx="400" cy="360" rx="360" ry="300" fill="url(#glow)"/>

  <!-- Bandeau -->
  <text x="400" y="70" text-anchor="middle" fill="#CBB89C" font-size="15" letter-spacing="6">CHARTE D'IDENTITÉ — COM-COM DEVIENT KOOM/KOOM</text>

  <!-- SYMBOLE : infini porté -->
  <g transform="translate(400,300)">
    <g transform="translate(-100,-50) scale(1.0)">
      <path d="M100 54 C100 18 168 18 168 54 C168 90 100 90 100 54 C100 18 32 18 32 54 C32 90 100 90 100 54 Z"
            fill="none" stroke="#5A3D12" stroke-width="17" stroke-linecap="round" opacity="0.5" transform="translate(0,5)"/>
      <path d="M100 50 C100 14 168 14 168 50 C168 86 100 86 100 50 C100 14 32 14 32 50 C32 86 100 86 100 50 Z"
            fill="none" stroke="url(#gold)" stroke-width="17" stroke-linecap="round"/>
    </g>
    <!-- berceau qui soutient -->
    <path d="M-70 95 C-70 200 70 200 70 95" fill="none" stroke="#5A3D12" stroke-width="22" stroke-linecap="round" opacity="0.5" transform="translate(0,6)"/>
    <path d="M-70 95 C-70 200 70 200 70 95" fill="none" stroke="url(#cradle)" stroke-width="20" stroke-linecap="round"/>
    <!-- barres de croissance -->
    <g fill="url(#gold)">
      <rect x="-13" y="120" width="11" height="20" rx="2"/>
      <rect x="2" y="108" width="11" height="32" rx="2"/>
      <rect x="17" y="94" width="11" height="46" rx="2"/>
    </g>
  </g>

  <!-- WORDMARK empilé K∞M / K∞M -->
  <g text-anchor="middle" font-weight="700">
    <g transform="translate(400,600)">
      <text x="-92" y="0" fill="#F4ECDC" font-size="120">K</text>
      <g transform="translate(0,-30)">
        <path d="M-48 30 C-48 6 -10 6 -10 30 C-10 54 -48 54 -48 30 Z M-10 30 C-10 6 28 6 28 30 C28 54 -10 54 -10 30 Z"
              fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round"/>
      </g>
      <text x="92" y="0" fill="#F4ECDC" font-size="120">M</text>
    </g>
    <g transform="translate(400,730)">
      <text x="-92" y="0" fill="#F4ECDC" font-size="120">K</text>
      <g transform="translate(0,-30)">
        <path d="M-48 30 C-48 6 -10 6 -10 30 C-10 54 -48 54 -48 30 Z M-10 30 C-10 6 28 6 28 30 C28 54 -10 54 -10 30 Z"
              fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round"/>
      </g>
      <text x="92" y="0" fill="#F4ECDC" font-size="120">M</text>
    </g>
  </g>

  <text x="400" y="800" text-anchor="middle" fill="#CBB89C" font-size="20" letter-spacing="10">SOUTENIR · DÉVELOPPER · GUIDER</text>

  <!-- anneau Sénégal -->
  <g transform="translate(400,840)">
    <rect x="-150" y="0" width="100" height="7" rx="3.5" fill="#1F8A57"/>
    <rect x="-50" y="0" width="100" height="7" rx="3.5" fill="#E9B949"/>
    <rect x="50" y="0" width="100" height="7" rx="3.5" fill="#D24A34"/>
  </g>

  <!-- palette -->
  <g transform="translate(150,900)">
    <rect x="0"   y="0" width="60" height="40" rx="6" fill="#E9B949"/>
    <rect x="75"  y="0" width="60" height="40" rx="6" fill="#E07B39"/>
    <rect x="150" y="0" width="60" height="40" rx="6" fill="#3B73D6"/>
    <rect x="225" y="0" width="60" height="40" rx="6" fill="#1F8A57"/>
    <rect x="300" y="0" width="60" height="40" rx="6" fill="#D24A34"/>
    <rect x="375" y="0" width="60" height="40" rx="6" fill="#121726"/>
    <rect x="450" y="0" width="60" height="40" rx="6" fill="#F4ECDC"/>
  </g>
  <text x="400" y="975" text-anchor="middle" fill="#7a6f5e" font-size="13" letter-spacing="3">Né et lancé au Sénégal — palette chaude premium</text>
</svg>
